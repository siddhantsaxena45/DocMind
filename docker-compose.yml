services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docmind_backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    environment:
      # Overrides or additional container env vars
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docmind_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
