name: DocMind CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint, Security & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest-asyncio

      - name: Code Quality & Security Linting
        working-directory: ./backend
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --exclude=venv,.venv --show-source --statistics
          # Exit-zero treats all warnings as non-fatal
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --exclude=venv,.venv --statistics

      - name: Run Unit, Semantic Cache & Guardrail Tests
        working-directory: ./backend
        env:
          JWT_SECRET: "ci-test-jwt-secret-key-2026"
        run: |
          python -m pytest tests/test_rag_chatbot.py tests/test_semantic_cache.py tests/test_full_rag_pipeline.py -v

  frontend-build:
    name: Frontend Build & Type Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Production Bundle
        working-directory: ./frontend
        run: npm run build

  rag-ai-evals:
    name: Automated RAG Quality Evals (Ragas / RAG Triad)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Ragas Evaluation Benchmark
        working-directory: ./backend
        env:
          GOOGLE_API_KEY1: ${{ secrets.GOOGLE_API_KEY1 }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          if [ -n "$GOOGLE_API_KEY1" ]; then
            python -m pytest tests/evals_ragas.py -s -v
          else
            echo "GOOGLE_API_KEY1 not configured in repo secrets; running offline evaluation integrity test."
            python -c "from tests.evals_ragas import evaluate_faithfulness, evaluate_answer_relevance, evaluate_context_precision; assert evaluate_faithfulness('test ans', 'test ans') == 1.0; print('Eval metrics verified.')"
          fi

      - name: Publish Evaluation Scorecard to GitHub Step Summary
        if: always()
        run: |
          if [ -f "backend/tests/eval_results.md" ]; then
            cat backend/tests/eval_results.md >> $GITHUB_STEP_SUMMARY
          fi

